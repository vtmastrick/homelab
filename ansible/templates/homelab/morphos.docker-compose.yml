name: morphos
services:
  morphos-server:
    image: ghcr.io/danvergara/morphos-server:latest
    container_name: morphos
    environment:
      - PUID=5086
      - GUID=5086
    volumes:
      - /tmp:/tmp
      - /etc/timezone:/etc/timezone:ro
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 30s
    restart: unless-stopped
    networks:
      - morphos
      - nginx-bridge

networks:
  morphos:
  nginx-bridge:
    external: true
